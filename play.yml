---
- name: Upgrade ubuntu
  hosts: ubuntu
  gather_facts: true
  become: true

  roles:
    - bootstrap
    - update_package_cache
    - update

- name: Upgrade RPi
  hosts: pi
  gather_facts: true
  gather_subset: [min]
  become: true

  roles:
    - rpi_upgrade

- name: Upgrade containers
  hosts: compose
  gather_facts: true
  become: true

  roles:
    - docker_compose

- name: Upgrade Incus hosts and their Ubuntu containers
  hosts: incus
  gather_facts: true
  become: true

  roles:
    - incus_upgrade
