---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PY_COLORS: "1"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  pre-commit:
    name: Lint (pre-commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install "$(grep '^pre-commit==' requirements-dev.txt)"

      - name: Run all hooks
        env:
          # Lets zizmor run its online audits (e.g. impostor commits).
          GH_TOKEN: ${{ github.token }}
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python }}, ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", ansible: "2.17"}
          - {python: "3.12", ansible: "2.17"}
          - {python: "3.11", ansible: "2.18"}
          - {python: "3.13", ansible: "2.19"}
          - {python: "3.12", ansible: "2.20"}
          - {python: "3.13", ansible: "2.21"}
          - {python: "3.14", ansible: "2.21"}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core and test tools
        env:
          ANSIBLE_VERSION: ${{ matrix.ansible }}
        run: |
          pip install "ansible-core~=${ANSIBLE_VERSION}.0" \
            "$(grep '^pytest==' requirements-dev.txt)" \
            "$(grep '^pytest-cov==' requirements-dev.txt)"
          ansible --version

      - name: Run unit tests and role tests against the mock Incus API
        run: pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-py${{ matrix.python }}-ansible${{ matrix.ansible }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore

  syntax:
    name: Playbook syntax check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ansible-core
        run: pip install "$(grep '^ansible-core==' requirements-dev.txt)"

      - name: Install roles and collections
        run: |
          ansible-galaxy role install -r roles/requirements.yml -p roles
          ansible-galaxy collection install -r collections/requirements.yaml -p collections

      - name: Syntax check
        run: ansible-playbook -i inventory.example.ini play.yml --syntax-check

      - name: List tasks per play
        run: ansible-playbook -i inventory.example.ini play.yml --list-tasks --list-tags
