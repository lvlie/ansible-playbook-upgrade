---
# Upgrade a single running Incus container (passed in as `incus_guest`).
# Everything runs through `incus exec` on the Incus host, so the guests need
# no SSH access or Python of their own.

- name: Build incus exec command for {{ incus_guest.name }}
  ansible.builtin.set_fact:
    incus_exec:
      - incus
      - exec
      - --project
      - "{{ incus_guest.project | default('default') }}"
      - --env
      - DEBIAN_FRONTEND=noninteractive
      - "{{ incus_guest.name }}"
      - --

- name: Detect operating system of {{ incus_guest.name }}
  ansible.builtin.command:
    argv: "{{ incus_exec + ['sh', '-c', '. /etc/os-release && echo \"$ID\"'] }}"
  register: incus_guest_os
  changed_when: false
  failed_when: false

- name: Upgrade Ubuntu guest {{ incus_guest.name }}
  when: incus_guest_os.stdout | trim == 'ubuntu'
  block:
    - name: Upgrade apt packages in {{ incus_guest.name }}
      ansible.builtin.command:
        argv: "{{ incus_exec + ['sh', '-c', apt_script] }}"
      vars:
        apt_script: >-
          apt-get update -q &&
          apt-get -y -q
          -o Dpkg::Options::=--force-confdef
          -o Dpkg::Options::=--force-confold
          dist-upgrade
      register: incus_guest_apt
      changed_when: "' 0 upgraded, 0 newly installed, 0 to remove' not in incus_guest_apt.stdout"

    - name: Find docker compose files in /root of {{ incus_guest.name }}
      ansible.builtin.command:
        argv: "{{ incus_exec + ['sh', '-c', find_script] }}"
      vars:
        find_script: >-
          command -v docker >/dev/null 2>&1 || exit 0;
          find /root -maxdepth {{ upgrade_compose_search_depth }} -type f
          \( -name compose.yaml -o -name compose.yml
          -o -name docker-compose.yaml -o -name docker-compose.yml \)
          -not -path '*/.*'
      register: incus_guest_compose_files
      changed_when: false

    - name: Pull and recreate compose projects in {{ incus_guest.name }}
      ansible.builtin.command:
        argv: "{{ incus_exec + ['sh', '-c', compose_script, 'sh', compose_file] }}"
      vars:
        compose_script: >-
          cd "$(dirname "$1")" &&
          docker compose -f "$1" pull --quiet &&
          docker compose -f "$1" up -d --remove-orphans
      loop: "{{ incus_guest_compose_files.stdout_lines }}"
      loop_control:
        loop_var: compose_file
      register: incus_guest_compose_up
      changed_when: >-
        'Recreate' in incus_guest_compose_up.stderr or
        'Created' in incus_guest_compose_up.stderr

    - name: Remove dangling docker images in {{ incus_guest.name }}
      ansible.builtin.command:
        argv: "{{ incus_exec + ['docker', 'image', 'prune', '--force'] }}"
      register: incus_guest_docker_prune
      changed_when: "'Total reclaimed space: 0B' not in incus_guest_docker_prune.stdout"
      when: incus_guest_compose_files.stdout_lines | length > 0

    - name: Clean up apt in {{ incus_guest.name }}
      ansible.builtin.command:
        argv: "{{ incus_exec + ['sh', '-c', 'apt-get -y -q autoremove --purge && apt-get -q clean'] }}"
      register: incus_guest_apt_clean
      changed_when: "' 0 to remove' not in incus_guest_apt_clean.stdout"

    - name: Check for pending restart of {{ incus_guest.name }}
      ansible.builtin.command:
        argv: "{{ incus_exec + ['test', '-f', '/var/run/reboot-required'] }}"
      register: incus_guest_reboot_required
      changed_when: false
      failed_when: false

    - name: Restart {{ incus_guest.name }}
      ansible.builtin.command:
        argv:
          - incus
          - restart
          - --project
          - "{{ incus_guest.project | default('default') }}"
          - "{{ incus_guest.name }}"
      changed_when: true
      when:
        - upgrade_restart_guests | bool
        - incus_guest_reboot_required.rc == 0

    - name: Report pending restart of {{ incus_guest.name }}
      ansible.builtin.debug:
        msg: "{{ incus_guest.name }} requires a restart (set upgrade_restart_guests=true to do this automatically)"
      when:
        - not upgrade_restart_guests | bool
        - incus_guest_reboot_required.rc == 0
