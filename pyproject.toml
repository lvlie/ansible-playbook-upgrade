[project]
name = "ansible-playbook-upgrade"
version = "0.0.0"
description = "Upgrade playbooks for Ubuntu, Raspberry Pi and Incus hosts"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "C4",  # comprehensions
  "UP",  # pyupgrade
  "S",   # bandit
  "SIM", # simplify
  "PT",  # pytest style
  "RUF", # ruff specific
]

[tool.ruff.lint.per-file-ignores]
# Ansible modules put their documentation strings before the imports and
# conventionally build arguments and results with dict().
"roles/*/library/*.py" = ["E402", "C408"]
# Tests use assert and run ansible-playbook / the module as subprocesses.
"tests/**/*.py" = ["S101", "S603", "S607", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["roles/incus_upgrade/library"]
